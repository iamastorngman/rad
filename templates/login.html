<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chakastani Room — Unlock</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="https://tse4.mm.bing.net/th/id/OIP.QrHRI-DeANanZhpqg7JrBQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="BF logo">
    <p class="eyebrow">YOUR PRIVATE SPACE</p>
    <h1>Chakastani Room</h1>
    <p class="muted">A private place to talk, share photos and videos, and stay connected.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" class="login-form">
      <label for="username">Your chat name</label>
      <input id="username" name="username" maxlength="24" placeholder="e.g. Kashan" autocomplete="nickname">
      <label for="password">Room password</label>
      <input id="password" name="password" type="password" placeholder="Enter the password" required autocomplete="current-password">
      <button type="submit">Unlock chat <span>→</span></button>
    </form>
    <p class="tiny">Only people with the room password can enter.</p>
  </main>
</body>
</html>
